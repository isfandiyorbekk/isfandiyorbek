<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <section>
      <div class="container">
        <div class="all">
          <div class="left">
            <img src="./img/logo.svg" alt="logo" />
            <img class="doira" src="./img/doira.svg" alt="img" />
            <img src="./img/Art.svg" alt="Art" />
            <h2>Welcome aboard my friend</h2>
            <p>just a couple of clicks and we start</p>
            <p><img src="./img/pager.svg" alt="img" /></p>
          </div>
          <div class="right">
            <h2>Welcome</h2>
            <form>
              <div class="email">
                <img src="./img/email.svg" alt="email" />
                <input type="email" placeholder="Email" />
              </div>
              <div class="password">
                <img src="./img/lock.svg" alt="lock" />
                <input type="password" placeholder="Password" />
                <img src="./img/view.svg" alt="view" />
              </div>
            </form>
            <a href="#" class="a">Forgot password?</a>
            <button class="login">Log in</button>
            <div class="or">
              <div class="bir"></div>
              <span>Or</span>
              <div class="ikki"></div>
            </div>
            <div class="social">
              <button class="google">
                <img src="./img/Google.svg" alt="Google" /> Google
              </button>
              <button class="gitlub">
                <img src="./img/gitlab.svg" alt="gitlab" /> GitLab
              </button>
            </div>
            <a href="#" class="last">Have no account yet?</a>
            <button class="button-last">Registration</button>
            <img class="bg" src="./img/bg.svg" alt="bg" />
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
